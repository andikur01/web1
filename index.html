<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLM LAPTOP STORE</title><style>
:root{--bg:#0b0f19;--c:#131a2a;--b:#24304a;--g:#d4af37;--t:#f1f5f9;--m:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:var(--bg);color:var(--t);padding-bottom:40px}
header{background:#0f1624;border-bottom:1px solid var(--b);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9}
.brand{font-weight:800;font-size:18px;color:var(--g)}.brand small{display:block;color:#fff;font-size:11px;font-weight:500}
nav button{background:var(--c);color:var(--t);border:1px solid var(--b);padding:7px 12px;border-radius:8px;font-weight:600;margin-left:6px;cursor:pointer}
nav button.on{background:var(--g);color:#000;border-color:var(--g)}.wrap{max-width:960px;margin:0 auto;padding:14px}
.box{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:185px;object-fit:cover;background:#090d16}.cb{padding:14px;flex:1;display:flex;flex-direction:column}
.tag{background:rgba(212,175,55,.15);color:var(--g);border:1px solid rgba(212,175,55,.35);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;width:fit-content;margin-bottom:6px}
.prc{color:var(--g);font-weight:800;font-size:17px;margin:4px 0 8px}.spc{color:var(--m);font-size:13px;white-space:pre-line;flex:1;margin-bottom:12px;line-height:1.4}
.btn{display:block;width:100%;text-align:center;padding:10px;border-radius:8px;border:0;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}
.wa{background:#10b981;color:#fff}.gold{background:var(--g);color:#000;margin-top:12px}
.del{background:#ef4444;color:#fff;border:0;padding:6px 10px;border-radius:6px;font-weight:700;cursor:pointer}
label{display:block;font-size:12px;color:var(--m);margin:10px 0 4px;font-weight:600}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--b);color:#fff;padding:10px;border-radius:8px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{margin-top:10px;padding:10px;border-radius:8px;font-size:13px;display:none}
.msg.ok{display:block;background:rgba(16,185,129,.15);border:1px solid #10b981;color:#6ee7b7}
.msg.er{display:block;background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#fca5a5}.hide{display:none!important}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid var(--b);border-radius:8px;margin-top:8px;background:var(--bg)}
.item img{width:48px;height:48px;object-fit:cover;border-radius:6px}
</style></head><body>
<header><div class="brand">GLM LAPTOP<small>Stok Resmi &amp; Bergaransi</small></div>
<nav><button id="t1" class="on" onclick="tab(1)">Katalog</button><button id="t2" onclick="tab(2)">Admin</button></nav></header>
<div class="wrap">
<div id="v1"><div class="box"><h3>Katalog Laptop Ready Stok</h3><p style="color:var(--m);font-size:13px;margin-top:4px">Unit dicek ketat, siap kirim/COD, bergaransi. Klik unit untuk pesan via WhatsApp.</p></div><div id="grid" class="grid">Memuat stok...</div></div>
<div id="v2" class="hide">
<div class="box"><h3 style="color:var(--g)">1. Pengaturan GitHub, WA &amp; Jadwal Bot</h3>
<label>GitHub Token</label><input type="password" id="tk" placeholder="ghp_... atau github_pat_...">
<div class="row"><div><label>No WA Admin (62...)</label><input id="wa" placeholder="6281234567890"></div>
<div><label>Jadwal Post FB</label><input id="jd" value="05:00, 11:00, 17:00"></div></div>
<button class="btn gold" onclick="saveCfg()">Simpan &amp; Sinkron Jadwal</button><div id="m1" class="msg"></div></div>
<div class="box"><h3 style="color:var(--g)">2. Tambah Laptop Baru</h3>
<label>Nama / Judul Laptop</label><input id="nm" placeholder="Lenovo ThinkPad X1 Carbon i7 RAM 16GB">
<div class="row"><div><label>Harga (angka saja)</label><input type="number" id="hg" placeholder="5500000"></div>
<div><label>Kategori</label><select id="kt"><option>Laptop Kerja &amp; Kuliah</option><option>Laptop Gaming &amp; Desain</option><option>MacBook</option></select></div></div>
<label>Spesifikasi &amp; Kelengkapan</label><textarea id="sp" rows="3" placeholder="Spek &amp; kelengkapan..."></textarea>
<label>Foto Laptop</label><input type="file" id="ft" accept="image/*">
<button class="btn gold" id="bAdd" onclick="addUnit()">Upload &amp; Simpan ke Web + Bot FB</button><div id="m2" class="msg"></div></div>
<div class="box"><h3 style="color:var(--g)">3. Stok Aktif (<span id="cnt">0</span>)</h3><div id="lst"></div></div>
</div></div><script>
const OW="andikur01",RW="web1",RB="bot-auto-fb";let db=[];
const $=id=>document.getElementById(id),rp=n=>"Rp "+Number(n||0).toLocaleString("id-ID"),b64u=s=>btoa(unescape(encodeURIComponent(s)));
const tab=n=>{["v1","v2"].forEach((x,i)=>$(x).classList.toggle("hide",i+1!==n));["t1","t2"].forEach((x,i)=>$(x).classList.toggle("on",i+1===n))};
const note=(id,ok,t)=>{const e=$(id);e.className="msg "+(ok?"ok":"er");e.textContent=t};
async function ghGet(r,p,tk){const h={Accept:"application/vnd.github.v3+json"};if(tk)h.Authorization="token "+tk;const x=await fetch(`https://api.github.com/repos/${OW}/${r}/contents/${p}?t=${Date.now()}`,{headers:h});return x.ok?x.json():null}
async function ghPut(r,p,c,m,tk){const ex=await ghGet(r,p,tk),b={message:m,content:c};if(ex&&ex.sha)b.sha=ex.sha;const x=await fetch(`https://api.github.com/repos/${OW}/${r}/contents/${p}`,{method:"PUT",headers:{Authorization:"token "+tk,Accept:"application/vnd.github.v3+json","Content-Type":"application/json"},body:JSON.stringify(b)});if(!x.ok){const e=await x.json().catch(()=>({}));throw new Error(e.message||x.status)}}
const comp=f=>new Promise((res,rej)=>{const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{const cv=document.createElement("canvas"),sc=im.width>1080?1080/im.width:1;cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL("image/jpeg",.82).split(",")[1])};im.onerror=rej;im.src=e.target.result};rd.onerror=rej;rd.readAsDataURL(f)});
function draw(){
 const w=localStorage.getItem("glm_wa")||"6281234567890";
 $("grid").innerHTML=db.length?db.map(u=>`<div class="card"><img src="./${u.foto||""}" onerror="this.style.display='none'"><div class="cb"><span class="tag">${u.kategori||"Ready"}</span><b>${u.nama||u.judul}</b><div class="prc">${rp(u.harga)}</div><div class="spc">${u.spek||u.deskripsi||""}</div><a class="btn wa" target="_blank" href="https://wa.me/${w}?text=${encodeURIComponent("Halo GLM Laptop, minat: "+(u.nama||u.judul)+" ("+rp(u.harga)+")")}">Beli / Tanya WhatsApp</a></div></div>`).join(""):`<div class="box" style="grid-column:1/-1;text-align:center;color:var(--m)">Belum ada stok laptop dipajang.</div>`;
 $("cnt").textContent=db.length;
 $("lst").innerHTML=db.length?db.map((u,i)=>`<div class="item"><div style="display:flex;align-items:center;gap:10px"><img src="./${u.foto||""}" onerror="this.style.display='none'"><div><b>${u.nama||u.judul}</b><div style="color:var(--g);font-size:13px">${rp(u.harga)}</div></div></div><button class="del" onclick="delUnit(${i})">Hapus</button></div>`).join(""):`<p style="color:var(--m);font-size:13px">Stok kosong.</p>`;
}
async function load(){try{const r=await fetch("./stok.json?t="+Date.now());db=r.ok?await r.json():[]}catch(e){db=[]}draw()}
async function saveCfg(){
 const tk=$("tk").value.trim(),wa=$("wa").value.trim(),jd=$("jd").value.trim();if(!tk)return note("m1",0,"Isi GitHub Token dulu.");
 localStorage.setItem("glm_tk",tk);if(wa)localStorage.setItem("glm_wa",wa);localStorage.setItem("glm_jd",jd);
 const jam=jd.split(",").map(s=>s.trim()).filter(Boolean);
 try{note("m1",1,"Menyinkronkan jadwal...");await ghPut(RB,"jadwal.json",b64u(JSON.stringify({aktif:true,jadwal:jam,jam:jam},null,2)),"Update jadwal",tk);note("m1",1,"Jadwal ("+jam.join(", ")+") tersinkron!");draw()}catch(e){note("m1",0,"Gagal: "+e.message)}
}
async function addUnit(){
 const tk=$("tk").value.trim()||localStorage.getItem("glm_tk")||"",nm=$("nm").value.trim(),hg=Number($("hg").value||0),kt=$("kt").value,sp=$("sp").value.trim(),fl=$("ft").files[0];
 if(!tk)return note("m2",0,"Isi Token di bagian 1 dulu.");if(!nm||!hg||!fl)return note("m2",0,"Nama, harga, & foto wajib diisi.");$("bAdd").disabled=1;
 try{
  note("m2",1,"Mengunggah foto...");const img=await comp(fl),id="GLM-"+Date.now(),fp=`images/${id}.jpg`;
  await ghPut(RW,fp,img,"Foto "+id,tk);await ghPut(RB,fp,img,"Foto "+id,tk);
  const nx=[{id,nama:nm,judul:nm,harga:hg,kategori:kt,spek:sp,deskripsi:sp,foto:fp,status:"ready"},...db],jb=b64u(JSON.stringify(nx,null,2));
  note("m2",1,"Menyimpan stok...");await ghPut(RW,"stok.json",jb,"Tambah "+nm,tk);await ghPut(RB,"stok.json",jb,"Tambah "+nm,tk);
  db=nx;$("nm").value="";$("hg").value="";$("sp").value="";$("ft").value="";draw();note("m2",1,"BERHASIL! Unit tampil di web & siap dipost bot FB.");
 }catch(e){note("m2",0,"Gagal: "+e.message)}finally{$("bAdd").disabled=0}
}
async function delUnit(i){
 const tk=$("tk").value.trim()||localStorage.getItem("glm_tk")||"";if(!tk)return alert("Isi Token dulu");if(!confirm("Hapus unit ini?"))return;
 try{const nx=db.filter((_,x)=>x!==i),jb=b64u(JSON.stringify(nx,null,2));await ghPut(RW,"stok.json",jb,"Hapus unit",tk);await ghPut(RB,"stok.json",jb,"Hapus unit",tk);db=nx;draw()}catch(e){alert("Gagal: "+e.message)}
}
window.onload=()=>{$("tk").value=localStorage.getItem("glm_tk")||"";$("wa").value=localStorage.getItem("glm_wa")||"";$("jd").value=localStorage.getItem("glm_jd")||"05:00, 11:00, 17:00";if(location.hash==="#admin")tab(2);load()};
</script></body></html>
